name: SentinelOps CD Pipeline (Docker Release)

# 1. Gatilho (Trigger): Só roda quando criarmos uma tag de versão (ex: v1.0.0)
on:
  push:
    tags:
      - 'v*.*.*'

# Permissões necessárias para publicar no GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  build-and-push-docker:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Prepara o emulador QEMU e Buildx para builds super rápidos e otimizados
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Faz login no Registro do GitHub sem precisar de senhas manuais (usa o token nativo do Actions)
      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extrai os metadados (tags) do GitHub para nomear a imagem automaticamente
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      # Constrói a imagem e envia (push) para o repositório
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Usa cache de camadas do Docker para economizar minutos de processamento
          cache-from: type=gha
          cache-to: type=gha,mode=max